<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     DESIGN TOKENS
     Change any of these hex values and the whole page shifts with it.
     --------------------------------------------------------------- */
  :root {
    --ground:  #0E1D24;   /* deep petrol background */
    --surface: #16303A;   /* raised panels */
    --edge:    #24454F;   /* hairlines */
    --chalk:   #F2EFE6;   /* the letter itself */
    --muted:   #8AA6AF;   /* secondary text */
    --lapis:   #4C7FA8;   /* structure, correct */
    --saffron: #D4A13A;   /* connecting strokes, highlight */
    --clay:    #B4483C;   /* wrong */

    --arabic: 'Amiri', 'Traditional Arabic', 'Geeza Pro', 'Noto Naskh Arabic', serif;
    --ui: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--chalk);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 20px 16px 56px;
  }

  .app { width: 100%; max-width: 520px; }

  /* ---- header ---- */
  header { margin-bottom: 22px; }

  h1 {
    font-family: var(--arabic);
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .tagline { color: var(--muted); font-size: 14px; margin: 0; }

  /* ---- the three-tab switch ---- */
  .switch {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 3px;
    margin: 20px 0 10px;
  }

  .switch button {
    flex: 1;
    padding: 9px 0;
    background: none;
    border: 0;
    border-radius: 7px;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  .switch button[aria-pressed="true"] {
    background: var(--lapis);
    color: #08161C;
    font-weight: 600;
  }

  /* one line under the tabs saying what this screen is for */
  .mode-note {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 20px;
    line-height: 1.5;
  }

  /* ---- the big letter on screen ---- */
  .stage {
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 28px 16px 24px;
    text-align: center;
    margin-bottom: 18px;
  }

  .stage.tappable { cursor: pointer; }
  .stage.tappable:hover { border-color: var(--lapis); }

  .glyph {
    font-family: var(--arabic);
    font-size: 140px;
    line-height: 1.35;
    color: var(--chalk);
    user-select: none;
  }

  /* The joining strokes get their own colour. This is the whole point of
     the app: it shows which part is the LETTER and which part is just
     the stroke connecting it to its neighbours. */
  .tail { color: var(--saffron); opacity: 0.55; }

  .position-label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ---- the revealed answer in Recall mode ---- */
  .reveal { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--edge); }
  .reveal .rname { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .reveal .rsound { font-size: 14px; color: var(--muted); margin: 0; }
  .reveal-prompt { margin-top: 18px; font-size: 14px; color: var(--muted); }

  /* ---- buttons that advance ---- */
  .next {
    width: 100%;
    background: var(--lapis);
    border: 0;
    border-radius: 11px;
    color: #08161C;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 15px 0;
    cursor: pointer;
  }

  .next.ghost {
    background: none;
    border: 1px solid var(--edge);
    color: var(--chalk);
    font-weight: 400;
  }

  .next.ghost:hover { border-color: var(--lapis); }

  /* ---- answer choices in Drill mode ---- */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .choice {
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 11px;
    color: var(--chalk);
    font: inherit;
    font-size: 17px;
    padding: 16px 10px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }

  .choice:hover:not(:disabled) { border-color: var(--lapis); }
  .choice .key { color: var(--muted); font-size: 12px; margin-right: 7px; }
  .choice.correct { background: var(--lapis); border-color: var(--lapis); color: #08161C; font-weight: 600; }
  .choice.wrong { background: var(--clay); border-color: var(--clay); }
  .choice:disabled { cursor: default; }

  /* ---- feedback line ---- */
  .feedback {
    min-height: 44px;
    margin-top: 16px;
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }

  .feedback b { color: var(--chalk); font-weight: 600; }

  /* ---- score strip ---- */
  .score {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--edge);
    padding-top: 12px;
    margin-top: 18px;
  }

  .score b { color: var(--saffron); font-weight: 600; }

  /* ---- level picker (shared by Recall and Drill) ---- */
  .levels { display: flex; gap: 8px; margin-bottom: 18px; }

  .levels button {
    flex: 1;
    background: none;
    border: 1px solid var(--edge);
    border-radius: 9px;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 9px 4px;
    cursor: pointer;
  }

  .levels button[aria-pressed="true"] { border-color: var(--saffron); color: var(--saffron); }

  /* ---- reference grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .tile {
    background: var(--surface);
    border: 1px solid var(--edge);
    border-radius: 10px;
    color: var(--chalk);
    cursor: pointer;
    padding: 14px 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font: inherit;
  }

  .tile:hover { border-color: var(--lapis); }
  .tile[aria-expanded="true"] { border-color: var(--saffron); }

  .tile-glyph {
    font-family: var(--arabic);
    font-size: 34px;
    line-height: 1.1;
  }

  .tile-name {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.2;
    text-align: center;
  }

  /* ---- the play button ---- */
  .play {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid var(--edge);
    border-radius: 9px;
    color: var(--chalk);
    font: inherit;
    font-size: 14px;
    padding: 9px 15px;
    cursor: pointer;
    margin-bottom: 14px;
  }

  .play:hover { border-color: var(--saffron); color: var(--saffron); }
  .play svg { width: 15px; height: 15px; fill: currentColor; }
  .play.playing { border-color: var(--saffron); color: var(--saffron); }

  /* Only takes up room when it actually has something to say. */
  .audio-status {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
  }

  .audio-status:not(:empty) { margin: -6px 0 12px; }

  /* ---- expanded letter detail ----
     This sits on top of the page rather than inside it, pinned to the
     bottom of the screen. That way opening a letter never pushes the
     grid around, so you can tap straight down the alphabet and the
     tiles stay exactly where they are. */
  .detail {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--saffron);
    border-bottom: 0;
    border-radius: 14px 14px 0 0;
    padding: 18px 16px 20px;
    box-shadow: 0 -18px 40px rgba(0, 0, 0, 0.55);
    z-index: 10;
  }

  .detail h2 { font-size: 20px; margin: 0 0 2px; padding-right: 34px; }

  /* the close button in the corner of the sheet */
  .sheet-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 30px;
    height: 30px;
    background: none;
    border: 1px solid var(--edge);
    border-radius: 8px;
    color: var(--muted);
    font: inherit;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }

  .sheet-close:hover { border-color: var(--saffron); color: var(--saffron); }
  .detail .sound { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  /* Left-to-right, because the labels under them are English and you
     learn the forms in this order: alone, start, middle, end. */
  .forms {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .form-cell { text-align: center; }

  .form-cell .g {
    font-family: var(--arabic);
    font-size: 46px;
    line-height: 1.5;
  }

  .form-cell .n {
    font-size: 11px;
    color: var(--muted);
  }

  .form-cell.none .g { color: var(--edge); }

  .note {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin: 14px 0 0;
    padding-top: 12px;
    border-top: 1px solid var(--edge);
  }

  /* Blank space under the grid so the sheet never covers the last
     letters. Its exact height is set in JS to match the sheet. */
  .sheet-spacer { height: 0; }

  :focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 400px) {
    .glyph { font-size: 108px; }
    .grid { grid-template-columns: repeat(3, 1fr); }
    .switch button { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Arabic letters</h1>
    <p class="tagline">Twenty-eight letters. The shape changes depending on where it sits in the word — that's the part that makes it look unreadable at first.</p>
  </header>

  <div class="switch" role="group" aria-label="Mode">
    <button id="btn-reference" aria-pressed="true">Reference</button>
    <button id="btn-recall" aria-pressed="false">Recall</button>
    <button id="btn-drill" aria-pressed="false">Drill</button>
  </div>

  <p class="mode-note" id="mode-note"></p>

  <main id="view"></main>

</div>

<script>
/* =================================================================
   1. THE DATA
   Everything the app knows lives in this one array. Add, remove, or
   change anything here and the interface updates on refresh.

   forms: the letter written on its own, at the start of a word, in
   the middle, and at the end. Six letters never connect forward, so
   their initial and medial forms are null.

   group: letters that share the same skeleton and differ only in
   dots. Used to pick hard wrong answers in the drill.
   ================================================================= */
const LETTERS = [
  { ar:'ا', name:'alif', arName:'أَلِف', slug:'alif',  sound:'long "aa"',                 group:'solo',  forms:{ isolated:'ا', initial:null,  medial:null,   final:'ـا' } },
  { ar:'ب', name:'ba', arName:'باء', slug:'ba',    sound:'b as in book',              group:'tooth', forms:{ isolated:'ب', initial:'بـ', medial:'ـبـ', final:'ـب' } },
  { ar:'ت', name:'ta', arName:'تاء', slug:'ta',    sound:'t as in top',               group:'tooth', forms:{ isolated:'ت', initial:'تـ', medial:'ـتـ', final:'ـت' } },
  { ar:'ث', name:'tha', arName:'ثاء', slug:'tha',   sound:'th as in think',            group:'tooth', forms:{ isolated:'ث', initial:'ثـ', medial:'ـثـ', final:'ـث' } },
  { ar:'ج', name:'jim', arName:'جيم', slug:'jim',   sound:'j as in jam',               group:'jim',   forms:{ isolated:'ج', initial:'جـ', medial:'ـجـ', final:'ـج' } },
  { ar:'ح', name:'ha', arName:'حاء', slug:'ha',    sound:'breathy h from the throat', group:'jim',   forms:{ isolated:'ح', initial:'حـ', medial:'ـحـ', final:'ـح' } },
  { ar:'خ', name:'kha', arName:'خاء', slug:'kha',   sound:'kh as in Scottish "loch"',  group:'jim',   forms:{ isolated:'خ', initial:'خـ', medial:'ـخـ', final:'ـخ' } },
  { ar:'د', name:'dal', arName:'دال', slug:'dal',   sound:'d as in door',              group:'dal',   forms:{ isolated:'د', initial:null,  medial:null,   final:'ـد' } },
  { ar:'ذ', name:'dhal', arName:'ذال', slug:'dhal',  sound:'th as in this',             group:'dal',   forms:{ isolated:'ذ', initial:null,  medial:null,   final:'ـذ' } },
  { ar:'ر', name:'ra', arName:'راء', slug:'ra',    sound:'a tapped r',                group:'ra',    forms:{ isolated:'ر', initial:null,  medial:null,   final:'ـر' } },
  { ar:'ز', name:'zay', arName:'زاي', slug:'zay',   sound:'z as in zoo',               group:'ra',    forms:{ isolated:'ز', initial:null,  medial:null,   final:'ـز' } },
  { ar:'س', name:'sin', arName:'سين', slug:'sin',   sound:'s as in sun',               group:'sin',   forms:{ isolated:'س', initial:'سـ', medial:'ـسـ', final:'ـس' } },
  { ar:'ش', name:'shin', arName:'شين', slug:'shin',  sound:'sh as in shoe',             group:'sin',   forms:{ isolated:'ش', initial:'شـ', medial:'ـشـ', final:'ـش' } },
  { ar:'ص', name:'sad', arName:'صاد', slug:'sad',   sound:'a heavy, deep s',           group:'sad',   forms:{ isolated:'ص', initial:'صـ', medial:'ـصـ', final:'ـص' } },
  { ar:'ض', name:'dad', arName:'ضاد', slug:'dad',   sound:'a heavy, deep d',           group:'sad',   forms:{ isolated:'ض', initial:'ضـ', medial:'ـضـ', final:'ـض' } },
  { ar:'ط', name:'ta (heavy)', arName:'طاء', slug:'ta-heavy', sound:'a heavy, deep t',      group:'ta',    forms:{ isolated:'ط', initial:'طـ', medial:'ـطـ', final:'ـط' } },
  { ar:'ظ', name:'dha (heavy)', arName:'ظاء', slug:'dha-heavy', sound:'a heavy, deep th',    group:'ta',    forms:{ isolated:'ظ', initial:'ظـ', medial:'ـظـ', final:'ـظ' } },
  { ar:'ع', name:'ayn', arName:'عين', slug:'ayn',   sound:'a squeeze in the throat',   group:'ayn',   forms:{ isolated:'ع', initial:'عـ', medial:'ـعـ', final:'ـع' } },
  { ar:'غ', name:'ghayn', arName:'غين', slug:'ghayn', sound:'like a French r, gargled',  group:'ayn',   forms:{ isolated:'غ', initial:'غـ', medial:'ـغـ', final:'ـغ' } },
  { ar:'ف', name:'fa', arName:'فاء', slug:'fa',    sound:'f as in fan',               group:'fa',    forms:{ isolated:'ف', initial:'فـ', medial:'ـفـ', final:'ـف' } },
  { ar:'ق', name:'qaf', arName:'قاف', slug:'qaf',   sound:'k from the back of throat', group:'fa',    forms:{ isolated:'ق', initial:'قـ', medial:'ـقـ', final:'ـق' } },
  { ar:'ك', name:'kaf', arName:'كاف', slug:'kaf',   sound:'k as in kite',              group:'solo',  forms:{ isolated:'ك', initial:'كـ', medial:'ـكـ', final:'ـك' } },
  { ar:'ل', name:'lam', arName:'لام', slug:'lam',   sound:'l as in lamp',              group:'solo',  forms:{ isolated:'ل', initial:'لـ', medial:'ـلـ', final:'ـل' } },
  { ar:'م', name:'mim', arName:'ميم', slug:'mim',   sound:'m as in moon',              group:'solo',  forms:{ isolated:'م', initial:'مـ', medial:'ـمـ', final:'ـم' } },
  { ar:'ن', name:'nun', arName:'نون', slug:'nun',   sound:'n as in noon',              group:'tooth', forms:{ isolated:'ن', initial:'نـ', medial:'ـنـ', final:'ـن' } },
  { ar:'ه', name:'ha (light)', arName:'هاء', slug:'ha-light', sound:'h as in hat',          group:'solo',  forms:{ isolated:'ه', initial:'هـ', medial:'ـهـ', final:'ـه' } },
  { ar:'و', name:'waw', arName:'واو', slug:'waw',   sound:'w, or long "oo"',           group:'solo',  forms:{ isolated:'و', initial:null,  medial:null,   final:'ـو' } },
  { ar:'ي', name:'ya', arName:'ياء', slug:'ya',    sound:'y, or long "ee"',           group:'tooth', forms:{ isolated:'ي', initial:'يـ', medial:'ـيـ', final:'ـي' } }
];

const POSITION_NAMES = {
  isolated: 'on its own',
  initial:  'start of a word',
  medial:   'middle of a word',
  final:    'end of a word'
};

// The order you learn them in. Used by the Reference detail panel.
const POSITION_ORDER = ['isolated', 'initial', 'medial', 'final'];

const MODE_NOTES = {
  reference: 'Every letter with its name. Tap one to hear it and see all four of its shapes.',
  recall:    'A letter with no name attached. Say it out loud, then reveal to check.',
  drill:     'Pick the right name. Wrong answers come from letters with the same skeleton, so look at the dots.'
};

/* =================================================================
   2. STATE
   Everything that changes while the app is running.
   Nothing here survives a refresh yet — see the note at the bottom.
   ================================================================= */
let state = {
  mode: 'reference',    // 'reference', 'recall', or 'drill'
  level: 'isolated',    // 'isolated' or 'all' — used by Recall and Drill
  openLetter: null,     // which letter is expanded in Reference
  card: null,           // the current Recall card
  revealed: false,      // has the Recall answer been shown
  seen: 0,              // how many Recall cards you've gone through
  question: null,       // the current Drill question
  answered: null,       // the name you picked, or null
  correct: 0,
  asked: 0,
  streak: 0
};

/* =================================================================
   3. HELPERS
   ================================================================= */

// The stretch character (tatweel) is what joins letters together.
// We wrap it in its own span so it can be coloured separately.
function paintGlyph(text) {
  return [...text].map(ch =>
    ch === 'ـ' ? '<span class="tail">ـ</span>' : ch
  ).join('');
}

function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function shuffle(list) {
  const copy = [...list];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* -----------------------------------------------------------------
   SOUND

   Two ways to hear a letter, tried in this order:

   1. A real recording. The app looks for a file named after the
      letter inside an "audio" folder — audio/ba.mp3, audio/qaf.mp3
      and so on. Drop a file in and it gets used automatically; no
      code change needed.

   2. The device's own Arabic voice, if it has one. Macs and iPhones
      can read Arabic aloud, but only if an Arabic voice has been
      installed. Many phones have none, which is why real recordings
      are worth making.

   If neither works, the app says so rather than sitting silent.
   ----------------------------------------------------------------- */
const AUDIO_FOLDER = 'audio/';

// Ask the browser for its voice list early, because on some devices
// the list is empty the very first time you ask for it.
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

function arabicVoice() {
  if (!('speechSynthesis' in window)) return null;
  return speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ar')) || null;
}

// Shows a short line under the play button. Pass '' to clear it.
function setAudioStatus(text) {
  const el = document.getElementById('audio-status');
  if (el) el.textContent = text;
}

function playLetter(letter) {
  setAudioStatus('');

  const recording = new Audio(AUDIO_FOLDER + letter.slug + '.mp3');

  // If there's no recording, fall back to the device voice. Only once.
  let usedFallback = false;
  const fallback = () => {
    if (usedFallback) return;
    usedFallback = true;
    speakLetter(letter);
  };

  recording.addEventListener('error', fallback);
  recording.play().catch(fallback);
}

function speakLetter(letter) {
  const voice = arabicVoice();

  if (!voice) {
    setAudioStatus('No Arabic voice on this device, and no recording for this letter yet.');
    return;
  }

  speechSynthesis.cancel();
  const said = new SpeechSynthesisUtterance(letter.arName);
  said.voice = voice;
  said.lang = voice.lang;
  said.rate = 0.8;          // a little slower than normal speech
  speechSynthesis.speak(said);
}

// A small speaker icon, drawn in the page rather than loaded as a file.
const SPEAKER_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true">
  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2v2a8 8 0 0 1 0 16v2a10 10 0 0 0 0-20z"/>
</svg>`;

// Which forms of this letter are allowed at the current difficulty.
function availablePositions(letter) {
  return state.level === 'isolated'
    ? ['isolated']
    : POSITION_ORDER.filter(p => letter.forms[p] !== null);
}

/* =================================================================
   4. BUILDING A CARD AND A QUESTION
   ================================================================= */

// Recall: just a letter and one of its shapes. No options.
function makeCard() {
  const letter = pickRandom(LETTERS);
  return { letter, position: pickRandom(availablePositions(letter)) };
}

function nextCard() {
  state.card = makeCard();
  state.revealed = false;
  render();
}

// Drill: a letter, a shape, and three wrong answers. Wrong answers
// come from the same skeleton group where possible, so you are
// forced to actually look at the dots.
function makeQuestion() {
  const letter = pickRandom(LETTERS);
  const position = pickRandom(availablePositions(letter));

  const sameGroup = LETTERS.filter(l => l.group === letter.group && l.name !== letter.name);
  const others    = LETTERS.filter(l => l.group !== letter.group);
  const distractors = [...shuffle(sameGroup), ...shuffle(others)].slice(0, 3);

  return { letter, position, options: shuffle([letter, ...distractors]) };
}

function nextQuestion() {
  state.question = makeQuestion();
  state.answered = null;
  render();
}

/* =================================================================
   5. RENDERING
   One function per screen.
   ================================================================= */
const view = document.getElementById('view');

// --- the difficulty toggle, shared by Recall and Drill ---
function levelPickerHtml() {
  return `
    <div class="levels" role="group" aria-label="Difficulty">
      <button id="lvl-isolated" aria-pressed="${state.level === 'isolated'}">Letters on their own</button>
      <button id="lvl-all" aria-pressed="${state.level === 'all'}">All four positions</button>
    </div>`;
}

function wireLevelPicker(onChange) {
  document.getElementById('lvl-isolated').onclick = () => { state.level = 'isolated'; onChange(); };
  document.getElementById('lvl-all').onclick     = () => { state.level = 'all';      onChange(); };
}

/* ---------- TAB 1: REFERENCE ---------- */
function renderReference() {
  let html = '';
  let sheet = '';

  if (state.openLetter) {
    const l = state.openLetter;

    const cells = POSITION_ORDER.map(pos => {
      const glyph = l.forms[pos];
      if (!glyph) {
        return `<div class="form-cell none">
                  <div class="g">—</div>
                  <div class="n">${POSITION_NAMES[pos]}</div>
                </div>`;
      }
      return `<div class="form-cell">
                <div class="g" dir="rtl">${paintGlyph(glyph)}</div>
                <div class="n">${POSITION_NAMES[pos]}</div>
              </div>`;
    }).join('');

    const joins = l.forms.initial
      ? 'Connects on both sides.'
      : 'Never connects to the letter that follows it, so a word can break apart right after it.';

    sheet = `<div class="detail" id="sheet">
               <button class="sheet-close" id="btn-close" aria-label="Close">&times;</button>
               <h2>${escapeHtml(l.name)}</h2>
               <p class="sound">${escapeHtml(l.sound)}</p>
               <button class="play" id="btn-play">${SPEAKER_ICON} Hear it</button>
               <p class="audio-status" id="audio-status"></p>
               <div class="forms">${cells}</div>
               <p class="note">${joins} The gold strokes are not part of the letter — they are the joins to whatever sits beside it.</p>
             </div>`;
  }

  html += `<div class="grid">` + LETTERS.map((l, i) => `
    <button class="tile" data-letter="${i}" aria-expanded="${state.openLetter === l}">
      <span class="tile-glyph">${l.ar}</span>
      <span class="tile-name">${escapeHtml(l.name)}</span>
    </button>`).join('') + `</div>
    <div class="sheet-spacer" id="spacer"></div>` + sheet;

  view.innerHTML = html;

  // Reserve blank space under the grid exactly as tall as the sheet,
  // so the bottom row of letters is still reachable while it's open.
  const sheetEl = document.getElementById('sheet');
  const spacer = document.getElementById('spacer');
  if (sheetEl && spacer) spacer.style.height = (sheetEl.offsetHeight + 16) + 'px';

  view.querySelectorAll('.tile').forEach(tile => {
    tile.onclick = () => {
      const l = LETTERS[Number(tile.dataset.letter)];
      const wasOpen = state.openLetter === l;
      state.openLetter = wasOpen ? null : l;
      render();
      // Tapping a letter opens it and says it out loud. The page does
      // not scroll — you stay wherever you were in the alphabet.
      if (!wasOpen) playLetter(l);
    };
  });

  // The "Hear it" button inside the opened letter.
  const playBtn = document.getElementById('btn-play');
  if (playBtn) playBtn.onclick = () => playLetter(state.openLetter);

  const closeBtn = document.getElementById('btn-close');
  if (closeBtn) closeBtn.onclick = () => { state.openLetter = null; render(); };
}

/* ---------- TAB 2: RECALL ---------- */
function renderRecall() {
  if (!state.card) state.card = makeCard();

  const { letter, position } = state.card;
  const glyph = letter.forms[position];

  const answer = state.revealed
    ? `<div class="reveal">
         <p class="rname">${escapeHtml(letter.name)}</p>
         <p class="rsound">${escapeHtml(letter.sound)}</p>
       </div>`
    : `<p class="reveal-prompt">Tap the card to reveal</p>`;

  view.innerHTML = `
    ${levelPickerHtml()}

    <div class="stage ${state.revealed ? '' : 'tappable'}" id="card" ${state.revealed ? '' : 'role="button" tabindex="0"'}>
      <div class="glyph" dir="rtl">${paintGlyph(glyph)}</div>
      <div class="position-label">${POSITION_NAMES[position]}</div>
      ${answer}
    </div>

    <button class="next ${state.revealed ? '' : 'ghost'}" id="btn-next">
      ${state.revealed ? 'Next letter' : 'Skip'}
    </button>

    <div class="score">
      <span>Cards seen <b>${state.seen}</b></span>
      <span>${state.level === 'isolated' ? 'Letters on their own' : 'All four positions'}</span>
    </div>
  `;

  const card = document.getElementById('card');
  if (!state.revealed) {
    card.onclick = reveal;
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } };
  }

  document.getElementById('btn-next').onclick = () => { state.seen++; nextCard(); };
  wireLevelPicker(nextCard);
}

function reveal() {
  state.revealed = true;
  render();
}

/* ---------- TAB 3: DRILL ---------- */
function renderDrill() {
  if (!state.question) state.question = makeQuestion();

  const q = state.question;
  const glyph = q.letter.forms[q.position];

  const choices = q.options.map((opt, i) => {
    let cls = 'choice';
    if (state.answered) {
      if (opt.name === q.letter.name) cls += ' correct';
      else if (opt.name === state.answered) cls += ' wrong';
    }
    return `<button class="${cls}" data-name="${escapeHtml(opt.name)}" ${state.answered ? 'disabled' : ''}>
              <span class="key">${i + 1}</span>${escapeHtml(opt.name)}
            </button>`;
  }).join('');

  let feedback = 'Which letter is this?';
  if (state.answered) {
    feedback = state.answered === q.letter.name
      ? `Yes — <b>${escapeHtml(q.letter.name)}</b>, ${escapeHtml(q.letter.sound)}. Press space for the next one.`
      : `That was <b>${escapeHtml(q.letter.name)}</b>, ${escapeHtml(q.letter.sound)}. Press space to keep going.`;
  }

  view.innerHTML = `
    ${levelPickerHtml()}

    <div class="stage">
      <div class="glyph" dir="rtl">${paintGlyph(glyph)}</div>
      <div class="position-label">${POSITION_NAMES[q.position]}</div>
    </div>

    <div class="choices">${choices}</div>
    <p class="feedback">${feedback}</p>

    <div class="score">
      <span>Correct <b>${state.correct}</b> of ${state.asked}</span>
      <span>Streak <b>${state.streak}</b></span>
    </div>
  `;

  view.querySelectorAll('.choice').forEach(btn => {
    btn.onclick = () => answer(btn.dataset.name);
  });

  wireLevelPicker(nextQuestion);
}

function answer(name) {
  if (state.answered) return;
  state.answered = name;
  state.asked++;
  if (name === state.question.letter.name) {
    state.correct++;
    state.streak++;
  } else {
    state.streak = 0;
  }
  render();
}

/* ---------- the dispatcher ---------- */
function render() {
  ['reference', 'recall', 'drill'].forEach(m => {
    document.getElementById('btn-' + m).setAttribute('aria-pressed', state.mode === m);
  });

  document.getElementById('mode-note').textContent = MODE_NOTES[state.mode];

  if (state.mode === 'reference') renderReference();
  else if (state.mode === 'recall') renderRecall();
  else renderDrill();
}

/* =================================================================
   6. WIRING IT UP
   ================================================================= */
document.getElementById('btn-reference').onclick = () => { state.mode = 'reference'; render(); };
document.getElementById('btn-recall').onclick    = () => { state.mode = 'recall';    nextCard(); };
document.getElementById('btn-drill').onclick     = () => { state.mode = 'drill';     nextQuestion(); };

document.addEventListener('keydown', e => {
  // Space and Enter move you forward in both practice modes.
  if (e.key === ' ' || e.key === 'Enter') {
    if (state.mode === 'recall') {
      // The card itself handles this when it has keyboard focus.
      if (document.activeElement && document.activeElement.id === 'card') return;
      e.preventDefault();
      if (state.revealed) { state.seen++; nextCard(); } else { reveal(); }
      return;
    }
    if (state.mode === 'drill') {
      e.preventDefault();
      if (state.answered) nextQuestion();
      return;
    }
  }

  // Number keys answer the drill.
  if (state.mode === 'drill' && !state.answered) {
    const n = Number(e.key);
    if (n >= 1 && n <= 4) {
      const btn = view.querySelectorAll('.choice')[n - 1];
      if (btn) answer(btn.dataset.name);
    }
  }
});

render();

   localStorage.getItem, then save `state.correct` and `state.asked`

</script>
